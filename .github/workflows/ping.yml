name: ping
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acessa o site para ele não entrar em standby
        run: curl -fsS -m 60 --retry 2 -o /dev/null -w "%{http_code}\n" https://guiadopresenteperfeito.com.br/actuator/health
